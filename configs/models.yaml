# Study A LIVE experiment inventory — the SEVEN bf16 panel base/post pairs for the paid vast run.
# This is NOT the smoke: the free Mac plumbing smoke uses ONE small int4/Q4 stand-in (e.g. Qwen3-4B
# on llama.cpp) that is NOT listed here — see docs/local_smoke_quickstart.md.
# VERIFY param counts / repo availability with `hf` + model card before provisioning.
# tier: live GPU cost class (cheap/mid/giant) — all tiers are real bf16 panel runs, none is the smoke.
# serving_dtype: bf16 for EVERY live leg — never fp8 OR int4/Q4 (quantization perturbs the logits the
#   study measures). int4/Q4 is fine ONLY for the throwaway Mac smoke, whose numbers are discarded.

families:
  qwen:
    tier: cheap
    base_repo: Qwen/Qwen3.5-35B-A3B-Base
    post_api: { provider: openrouter, model: qwen/qwen3.5-35b-a3b, logprobs: true }
    params: { total: 35B, active: 3B, moe: true }
    serving: { dtype: bfloat16, tensor_parallel_size: 1, gpu: "1xH100-80", est_cost_usd: 5 }

  gemma:   # 7th annotator, added 2026-07-02 — eligible now that the evaluator pair is Anthropic+GPT
           # (Google/Gemini freed from the reserved-evaluator role). Google family.
    tier: cheap
    base_repo: google/gemma-4-26B-A4B
    post_api: { provider: vllm_hf, model: google/gemma-4-26B-A4B-it, logprobs: true }  # ungated Apache-2.0; both legs served from HF on vast vLLM. NOTE 2026-07-03: OpenRouter hosting of the -it post leg IS now verified (corpus seat-7 collection: Novita bf16 pin, 28/28 clean) — switching post to OpenRouter (consistent with the other post legs, no extra GPU time) vs keeping vllm_hf (post+base on the identical serving stack) is an OPEN USER DECISION; vllm_hf kept until decided.
    params: { total: 25.2B, active: 3.8B, experts: 128, experts_active: 8, moe: true }
    serving: { dtype: bfloat16, tensor_parallel_size: 1, gpu: "1xH100-80", est_cost_usd: 8 }  # ~50GB bf16 MoE fits one 80GB GPU; multimodal (text used), 256K ctx

  llama:
    tier: mid
    base_repo: meta-llama/Llama-4-Maverick-17B-128E
    post_api: { provider: openrouter, model: meta-llama/llama-4-maverick, logprobs: true }
    params: { total: 400B, active: 17B, experts: 128, moe: true }
    serving: { dtype: bfloat16, tensor_parallel_size: 8, expert_parallel: true, gpu: "8xH100-80", est_cost_usd: 60 }

  glm:
    tier: mid
    base_repo: zai-org/GLM-4.5-Base
    post_api: { provider: openrouter, model: z-ai/glm-4.5, logprobs: false }  # post lacks logprobs on OR
    params: { total: 355B, active: 32B, moe: true }
    serving: { dtype: bfloat16, tensor_parallel_size: 8, expert_parallel: true, gpu: "8xH200", est_cost_usd: 85 }

  deepseek:
    tier: giant
    base_repo: deepseek-ai/DeepSeek-V4-Pro-Base
    post_api: { provider: deepseek, model: deepseek-v4-pro, base_url: "https://api.deepseek.com", logprobs: true }
    params: { total: 1600B, active: 49B, moe: true }   # DeepSeek-V4-Pro ≈1.6T-A49B (verified HF 2026-07); 671B/37B was V3.1. 1.6T bf16 ≈3.2TB — the serving line below is under-provisioned; re-derive before the giant run.
    serving: { dtype: bfloat16, tensor_parallel_size: 8, pipeline_parallel_size: 2, gpu: "16xH100 (2 nodes)", est_cost_usd: 160 }

  mistral:
    tier: giant
    base_repo: mistralai/Mistral-Large-3-675B-Base-2512
    post_api: { provider: mistral, model: mistral-large-2512, base_url: "https://api.mistral.ai/v1", logprobs: false }
    params: { total: 675B, active: 41B, experts: true, moe: true }   # MoE (granular) + 2.5B vision encoder — verified HF 2026-07 (NOT dense)
    serving: { dtype: bfloat16, tensor_parallel_size: 8, pipeline_parallel_size: 2, gpu: "16xH100 (2 nodes)", est_cost_usd: 160 }

  kimi:
    tier: giant
    base_repo: moonshotai/Kimi-K2-Base
    post_api: { provider: openrouter, model: moonshotai/kimi-k2-thinking, logprobs: true }
    params: { total: 1T, active: 32B, moe: true }
    serving: { dtype: bfloat16, tensor_parallel_size: 8, pipeline_parallel_size: 2, gpu: "16xH200 (2 nodes)", est_cost_usd: 280 }

# Compliance scale + single-token labels for token-slicing (verify per tokenizer).
scale:
  levels: [very_low, low, moderate, high, very_high]
  answer_tokens: [" A", " B", " C", " D", " E"]   # A=very_low ... E=very_high
# LIVE elicitation contract (reasoning ON, real corpus k=4 few-shot). The Mac smoke (--no-reason)
# bypasses this — static SMOKE_FEWSHOT, no CoT — which is one reason its tau_oc is discarded.
elicitation:
  base: { method: token_slice, fewshot_source: judex-corpus/leaf_exemplars, fewshot_k: 4, temperature: 0 }
  post: { method: verbalized_plus_logprobs_where_available, temperature: 0 }
