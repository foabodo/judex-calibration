# Study A LIVE experiment inventory — the SEVEN bf16 panel base/post pairs for the paid vast run.
# This is NOT the smoke: the free Mac plumbing smoke uses ONE small int4/Q4 stand-in (e.g. Qwen3-4B
# on llama.cpp) that is NOT listed here — see docs/local_smoke_quickstart.md.
# VERIFY param counts / repo availability with `hf` + model card before provisioning.
# tier: live GPU cost class (cheap/mid/giant) — all tiers are real bf16 panel runs, none is the smoke.
# serving_dtype: bf16 for EVERY live leg — never fp8 OR int4/Q4 (quantization perturbs the logits the
#   study measures). int4/Q4 is fine ONLY for the throwaway Mac smoke, whose numbers are discarded.

# post_api semantics (clarified by the user 2026-07-03): the LIVE plan serves BOTH legs of every
# family from HF-downloaded weights on vast vLLM (bf16, token-slice — same channel as the base).
# Each post_api entry documents the API FALLBACK channel only, to be invoked solely if unquantized-
# model logits cannot feasibly be obtained from the HF weights; the user does not plan to invoke it.
# post_repo: the HF post twin the LIVE plan serves on vast vLLM (all seven verified present on HF
#   2026-07-14). scripts/measure_prompt_budget.py tokenizes both legs from these pins.
families:
  qwen:
    tier: cheap
    base_repo: Qwen/Qwen3.5-35B-A3B-Base
    post_repo: Qwen/Qwen3.5-35B-A3B
    post_api: { provider: openrouter, model: qwen/qwen3.5-35b-a3b, logprobs: true }
    params: { total: 35B, active: 3B, moe: true }
    serving: { dtype: bfloat16, tensor_parallel_size: 1, gpu: "1xH100-80", est_cost_usd: 5 }

  gemma:   # Google family. SWAPPED 2026-07-19 (user): gemma-4-26B-A4B → gemma-4-31B (dense) after the
           # 26B-A4B cheap-trial leg FAILED the accuracy gate (pre argmax 0.167 < 0.2 chance; τ_oc pegged
           # at the 20.0 bound — see runs/gemma @26B, memory study-a-cheap-trial-executed). The GT
           # ANNOTATOR seat (corpus seat-7) remains gemma-4-26B-A4B-it — that history does not move.
    tier: cheap
    base_repo: google/gemma-4-31B
    post_repo: google/gemma-4-31B-it
    post_api: { provider: vllm_hf, model: google/gemma-4-31B-it, logprobs: true }  # ungated (verified via HF API 2026-07-19); both legs served from HF on vast vLLM per the 2026-07-03 user decision (vllm_hf IS the plan; OpenRouter is a just-in-case fallback only — NOTE: the Novita bf16 availability verification was for 26B-A4B-it and has NOT been re-verified for 31B-it).
    params: { total: 31.3B, moe: false }   # dense (Gemma4ForConditionalGeneration), BF16 per HF API
    serving: { dtype: bfloat16, tensor_parallel_size: 1, gpu: "1xH200-141 (or 2xA100-SXM4 TP2)", est_cost_usd: 10 }  # ~63GB bf16 — too tight for one 80GB card with the echo-fallback fp32 log-softmax transient; size like Qwen

  llama:   # SWAPPED 2026-07-19 (user): Llama-4-Maverick → Llama-3.1-405B dense after the Maverick
           # base FAILED the gate (argmax 0.250; resolution 0.0197 ≈ noise; BOTH T* pegged at 20;
           # tau_oc ref-degenerate — runs/llama). The dense 405B base PASSES (0.392 / res 0.0393,
           # finite T — runs/llama31): second within-lineage dense rescue after Gemma 26B→31B.
           # Both 3.1 repos are HF-gated (manual, PER-ACCOUNT — verify FILE-LEVEL access, the API
           # metadata endpoint returns 200 without a grant); granted for the hf-token account
           # 2026-07-19.
    tier: mid
    base_repo: meta-llama/Llama-3.1-405B
    post_repo: meta-llama/Llama-3.1-405B-Instruct
    post_api: { provider: openrouter, model: meta-llama/llama-3.1-405b-instruct, logprobs: true }  # fallback only; availability NOT re-verified for 3.1 (the Maverick/DeepInfra check does not carry)
    params: { total: 405.9B, moe: false }   # dense, BF16 per HF API
    serving: { dtype: bfloat16, tensor_parallel_size: 8, gpu: "8xH200-141", est_cost_usd: 90 }  # ~810GB bf16 + KV needs the H200 node; no expert parallel (dense); k=5 prompt 20,506 worst (measured 2026-07-19)

  glm:
    tier: mid
    base_repo: zai-org/GLM-4.5-Base
    post_repo: zai-org/GLM-4.5
    post_api: { provider: openrouter, model: z-ai/glm-4.5, logprobs: false }  # post lacks logprobs on OR
    params: { total: 355B, active: 32B, moe: true }
    serving: { dtype: bfloat16, tensor_parallel_size: 8, expert_parallel: true, gpu: "8xH200", est_cost_usd: 85 }

  deepseek:
    tier: giant
    base_repo: deepseek-ai/DeepSeek-V4-Pro-Base
    post_repo: deepseek-ai/DeepSeek-V4-Pro
    post_api: { provider: deepseek, model: deepseek-v4-pro, base_url: "https://api.deepseek.com", logprobs: true }
    params: { total: 1600B, active: 49B, moe: true }   # DeepSeek-V4-Pro ≈1.6T-A49B (verified HF 2026-07); 671B/37B was V3.1. 1.6T bf16 ≈3.2TB — the serving line below is under-provisioned; re-derive before the giant run.
    serving: { dtype: bfloat16, tensor_parallel_size: 8, pipeline_parallel_size: 2, gpu: "16xH100 (2 nodes)", est_cost_usd: 160 }

  mistral:
    tier: giant
    base_repo: mistralai/Mistral-Large-3-675B-Base-2512
    post_repo: mistralai/Mistral-Large-3-675B-Instruct-2512
    post_api: { provider: mistral, model: mistral-large-2512, base_url: "https://api.mistral.ai/v1", logprobs: false }
    params: { total: 675B, active: 41B, experts: true, moe: true }   # MoE (granular) + 2.5B vision encoder — verified HF 2026-07 (NOT dense)
    serving: { dtype: bfloat16, tensor_parallel_size: 8, pipeline_parallel_size: 2, gpu: "16xH100 (2 nodes)", est_cost_usd: 160 }

  kimi:
    tier: giant
    base_repo: moonshotai/Kimi-K2-Base
    post_repo: moonshotai/Kimi-K2-Thinking
    post_api: { provider: openrouter, model: moonshotai/kimi-k2-thinking, logprobs: true }
    params: { total: 1T, active: 32B, moe: true }
    serving: { dtype: bfloat16, tensor_parallel_size: 8, pipeline_parallel_size: 2, gpu: "16xH200 (2 nodes)", est_cost_usd: 280 }

# Compliance scale + single-token labels for token-slicing (verify per tokenizer).
scale:
  levels: [very_low, low, moderate, high, very_high]
  answer_tokens: [" A", " B", " C", " D", " E"]   # A=very_low ... E=very_high
# LIVE elicitation contract (reasoning ON, real corpus k=5 few-shot). The Mac smoke (--no-reason)
# bypasses this — static SMOKE_FEWSHOT, no CoT — which is one reason its tau_oc is discarded.
# fewshot_k=5 (RAISED from 4, 2026-07-19, user directive): one exemplar per compliance level —
# the stratified round-robin at k=4 systematically omitted very_high (answer E, 27.5% of the GT
# argmax mass) from EVERY prompt; fixing it lifted Qwen argmax +11pp (base) / +17pp (post) and
# Gemma-31B +8/+11pp in the controlled k=4-vs-k=5 ablation. k must be >= the 5 scale levels;
# production judex-evaluator fixed_set is k=5 for the same reason. Prompt budget at k=5 (measured
# 2026-07-19, Qwen tokenizer): worst-case live prompt ~21.2k tokens + the 2048 CoT budget =>
# required context ~23.3k; serve every leg with --max-model-len >= 24576 (standard pin 32768) and
# re-run scripts/measure_prompt_budget.py per family tokenizer before provisioning.
elicitation:
  base: { method: token_slice, fewshot_source: judex-corpus/leaf_exemplars, fewshot_k: 5, temperature: 0 }
  # post's verbalized method applies only to the just-in-case API fallback above; the LIVE plan
  # token-slices the post leg on vast vLLM exactly like the base leg (same channel, no confound).
  post: { method: verbalized_plus_logprobs_where_available, temperature: 0 }
